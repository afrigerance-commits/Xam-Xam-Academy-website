<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | Xam Xam Academy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#021F4D">
  <!-- Chemins absolus : cette page peut être servie depuis n'importe quelle adresse du site -->
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .notfound {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem var(--gutter);
      text-align: center;
      background: var(--bg-soft);
    }
    .notfound .notfound__code {
      margin: 0;
      font-family: var(--font-heading);
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      color: var(--navy-900);
    }
    .notfound h1 {
      margin: 1rem 0 0.75rem;
      font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2rem);
    }
    .notfound p {
      max-width: 28rem;
      margin: 0 auto 2rem;
      color: var(--muted);
    }
    .notfound .brand {
      margin-bottom: 2.5rem;
    }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <a class="brand" href="/">
        <img class="brand__logo" src="/assets/img/logo-horizontal.png" alt="Xam Xam Academy — accueil" width="540" height="120">
      </a>
      <p class="notfound__code">404</p>
      <h1>Cette page est introuvable.</h1>
      <p>Le lien est peut-être incorrect ou la page n’existe plus. Revenez à l’accueil pour découvrir nos cours de Physique-Chimie.</p>
      <a class="btn btn--primary btn--lg" href="/">Retour à l’accueil</a>
    </div>
  </main>
</body>
</html>
