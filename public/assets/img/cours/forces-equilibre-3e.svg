<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
<title id="t">Équilibre d’un objet suspendu</title><desc id="d">Le poids agit verticalement vers le bas au centre G, la tension du fil verticalement vers le haut au point A. Les forces ont la même droite d’action et la même intensité dans le modèle à deux forces.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
<rect width="960" height="440" rx="24" fill="#faf7ef"/><path d="M190 65H430" stroke="#021f4d" stroke-width="10"/><path d="M310 70V170" stroke="#718096" stroke-width="4"/>
<rect x="250" y="170" width="120" height="100" rx="12" fill="#e8edf3" stroke="#021f4d" stroke-width="3"/>
<path d="M310 170V80" stroke="#997413" stroke-width="5" marker-end="url(#arrow)"/><path d="M310 220V310" stroke="#021f4d" stroke-width="5" marker-end="url(#arrow)"/>
<circle cx="310" cy="170" r="5" fill="#021f4d"/><circle cx="310" cy="220" r="5" fill="#021f4d"/>
<g font-family="Arial,sans-serif" font-size="22" fill="#021f4d"><text x="330" y="168">A</text><text x="330" y="226">G</text><text x="345" y="112">Tension T</text><text x="345" y="306">Poids P</text><text x="525" y="150" font-size="28" font-weight="700">Un objet, deux actions</text><text x="525" y="205">Terre → objet : poids</text><text x="525" y="250">Fil → objet : tension</text><text x="525" y="310">À l’équilibre : T = P</text><text x="70" y="390" font-size="19">Même droite d’action · Sens opposés · Intensités égales</text></g>
</svg>
